name: GitHub Metrics

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =========================================
      # LEFT PANEL
      # =========================================
      - name: Left Panel
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-left.svg
          token: ${{ secrets.METRICS }}
          user: KRYSTALM7

          template: classic
          base: header, activity, community, repositories
          base_indepth: yes

          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

          # -----------------------------------------
          # Languages
          # -----------------------------------------
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_threshold: 0%

          # -----------------------------------------
          # Lines of Code
          # -----------------------------------------
          plugin_lines: yes
          plugin_lines_history_limit: 5
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # -----------------------------------------
          # Follow-up
          # -----------------------------------------
          plugin_followup: yes
          plugin_followup_sections: repositories

          # 📌 Starred topics
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

          # 🕹️ Steam
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199150682391"
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_limit: 4
          plugin_steam_recent_games_limit: 4

          # -----------------------------------------
          # Recent Coding Habits
          # -----------------------------------------
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes

          output_action: commit
          committer_branch: main


      # =========================================
      # ACTIVITY PANEL
      # =========================================
      - name: Activity Panel
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-activity.svg
          token: ${{ secrets.METRICS }}
          user: KRYSTALM7

          base: ""

          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

          # -----------------------------------------
          # Recent GitHub Activity
          # -----------------------------------------
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes
          plugin_activity_skipped: KRYSTALM7/KRYSTALM7

          output_action: commit
          committer_branch: main


      # =========================================
      # RIGHT PANEL
      # =========================================
      - name: Right Panel
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics-right.svg
          token: ${{ secrets.METRICS }}
          user: KRYSTALM7

          base: ""

          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

          # -----------------------------------------
          # Contributions Calendar
          # -----------------------------------------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # -----------------------------------------
          # Recently Starred Repositories
          # -----------------------------------------
          plugin_stars: yes
          plugin_stars_limit: 4

          # -----------------------------------------
          # Followers
          # -----------------------------------------
          plugin_people: yes
          plugin_people_types: followers
          plugin_people_limit: 20
          plugin_people_size: 28

          # -----------------------------------------
          # LeetCode
          # -----------------------------------------
          plugin_leetcode: yes
          plugin_leetcode_user: SujanKumar
          plugin_leetcode_sections: solved, skills, recent
          plugin_leetcode_limit_skills: 6
          plugin_leetcode_limit_recent: 3

          output_action: commit
          committer_branch: main